<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - IT Inventory Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="images/logo.jpg" alt="TRANSWORLD GROUP SINGAPORE" class="logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <h1 class="logo-fallback" style="display: none;">TRANSWORLD GROUP SINGAPORE</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="add-product.html" class="active">Add Product</a>
                <a href="inventory.html">Inventory</a>
            </nav>
        </header>

        <main>
            <h2>Add New IT Product</h2>
            
            <form id="product-form" class="product-form">
                <div class="form-group">
                    <label for="company">Company *</label>
                    <input type="text" id="company" name="company" readonly value="" style="background: #f0f0f0; cursor: not-allowed;">
                </div>

                <div class="form-group">
                    <label for="name">Product Name *</label>
                    <input type="text" id="name" name="name" required placeholder="e.g., Dell XPS 13 Laptop">
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Desktop">Desktop</option>
                        <option value="Monitor">Monitor</option>
                        <option value="Keyboard">Keyboard</option>
                        <option value="Mouse">Mouse</option>
                        <option value="Printer">Printer</option>
                        <option value="Network Device">Network Device</option>
                        <option value="Server">Server</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="user">User *</label>
                    <input type="text" id="user" name="user" required placeholder="e.g., John Doe">
                </div>

                <div class="form-group">
                    <label for="warrantyExpiryDate">Warranty Expiry Date</label>
                    <input type="date" id="warrantyExpiryDate" name="warrantyExpiryDate" placeholder="Select warranty expiry date">
                </div>

                <div class="form-group">
                    <label for="cpu">CPU</label>
                    <input type="text" id="cpu" name="cpu" placeholder="e.g., Intel Core i7, AMD Ryzen 5">
                </div>

                <div class="form-group">
                    <label for="ram">RAM</label>
                    <input type="text" id="ram" name="ram" placeholder="e.g., 8GB, 16GB DDR4">
                </div>

                <div class="form-group">
                    <label for="hdd">HDD</label>
                    <input type="text" id="hdd" name="hdd" placeholder="e.g., 256GB SSD, 1TB HDD">
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="4" placeholder="Optional: Add product details, specifications, or notes"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Product</button>
                    <a href="inventory.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>

            <div id="message" class="message" style="display: none;"></div>
        </main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Check if company is selected
        window.onload = function() {
            const company = getSelectedCompany();
            if (!company) {
                window.location.href = 'index.html';
                return;
            }
            // Set company field to selected company
            document.getElementById('company').value = company;
            
            // Show warranty expiry warning
            showWarrantyWarning();
        };

        // Handle form submission
        document.getElementById('product-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const company = getSelectedCompany();
            const product = {
                id: generateUniqueId(), // Generate unique ID starting from 100
                company: company, // Use selected company
                name: document.getElementById('name').value.trim(),
                category: document.getElementById('category').value,
                user: document.getElementById('user').value.trim(),
                warrantyExpiryDate: document.getElementById('warrantyExpiryDate').value || '',
                cpu: document.getElementById('cpu').value.trim() || '',
                ram: document.getElementById('ram').value.trim() || '',
                hdd: document.getElementById('hdd').value.trim() || '',
                description: document.getElementById('description').value.trim(),
                dateAdded: new Date().toISOString().split('T')[0] // YYYY-MM-DD format
            };

            if (saveProduct(product)) {
                showMessage('Product added successfully!', 'success');
                document.getElementById('product-form').reset();
                
                // Redirect to inventory after 1.5 seconds
                setTimeout(() => {
                    window.location.href = 'inventory.html';
                }, 1500);
            } else {
                showMessage('Error saving product. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
