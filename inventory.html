<body>
    <div class="container">
        <header>
            <img src="images/logo.jpg" alt="TRANSWORLD GROUP SINGAPORE" class="logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <h1 class="logo-fallback" style="display: none;">TRANSWORLD GROUP SINGAPORE</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="add-product.html">Add Product</a>
                <a href="inventory.html" class="active">Inventory</a>
            </nav>
        </header>

        <main>
            <div class="page-header">
                <h2>Inventory</h2>
                <div class="page-actions">
                    <div class="company-selector">
                        <select id="company-switcher" class="company-select" onchange="switchCompany()">
                            <option value="">-- Select Company --</option>
                            <option value="TGLS">TGLS</option>
                            <option value="Transworld Terminals">Transworld Terminals</option>
                            <option value="SOL">SOL</option>
                            <option value="BLPL">BLPL</option>
                            <option value="TLPL">TLPL</option>
                        </select>
                    </div>
                    <div class="company-selector" id="branch-switcher-row" style="display: none;">
                        <select id="branch-switcher" class="company-select" onchange="switchBranch()">
                            <option value="">-- Select Branch --</option>
                            <option value="Nhavaseva">Nhavaseva</option>
                            <option value="Mundra Unit 1">Mundra Unit 1</option>
                            <option value="Mundra Unit 2">Mundra Unit 2</option>
                            <option value="Kolkata">Kolkata</option>
                            <option value="Dadri">Dadri</option>
                        </select>
                    </div>
                    <button onclick="document.getElementById('import-file').click()" class="btn btn-secondary">📥 Import from Excel</button>
                    <input type="file" id="import-file" accept=".csv,.xls,.xlsx" style="display: none;" onchange="importFromExcel(event)">
                    <button onclick="exportToExcel()" class="btn btn-secondary" id="export-btn" title="Export all products or filtered search results">📊 Export to Excel</button>
                    <a href="add-product.html" class="btn btn-primary">➕ Add Product</a>
                </div>
            </div>

            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 Search by product name, category, user, or description..." onkeyup="handleSearch()">
                <button onclick="clearSearch()" class="btn-clear-search" id="clear-search-btn" style="display: none;">✕ Clear</button>
            </div>

            <div id="inventory-container">
                <div id="empty-state" class="empty-state" style="display: none;">
                    <p>📦 No products in inventory yet.</p>
                    <a href="add-product.html" class="btn btn-primary">Add Your First Product</a>
                </div>

                <div id="inventory-list" class="inventory-list"></div>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Product</h2>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="edit-form" class="product-form" onsubmit="handleEditSubmit(event); return false;">
                <input type="hidden" id="edit-id" name="id">
                
                <div class="form-group">
                    <label for="edit-company">Company *</label>
                    <input type="text" id="edit-company" name="company" readonly value="" style="background: #f0f0f0; cursor: not-allowed;">
                </div>

                <div class="form-group">
                    <label for="edit-user">User *</label>
                    <input type="text" id="edit-user" name="user" required placeholder="e.g., John Doe">
                </div>

                <div class="form-group">
                    <label for="edit-name">Product Name *</label>
                    <input type="text" id="edit-name" name="name" required placeholder="e.g., Dell XPS 13 Laptop">
                </div>

                <div class="form-group">
                    <label for="edit-category">Category *</label>
                    <select id="edit-category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Desktop">Desktop</option>
                        <option value="Monitor">Monitor</option>
                        <option value="Keyboard">Keyboard</option>
                        <option value="Mouse">Mouse</option>
                        <option value="Printer">Printer</option>
                        <option value="Network Device">Network Device</option>
                        <option value="Server">Server</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="edit-warrantyExpiryDate">Warranty Expiry Date</label>
                    <input type="date" id="edit-warrantyExpiryDate" name="warrantyExpiryDate" placeholder="Select warranty expiry date">
                </div>

                <div class="form-group">
                    <label for="edit-cpu">CPU</label>
                    <input type="text" id="edit-cpu" name="cpu" placeholder="e.g., Intel Core i7, AMD Ryzen 5">
                </div>

                <div class="form-group">
                    <label for="edit-ram">RAM</label>
                    <input type="text" id="edit-ram" name="ram" placeholder="e.g., 8GB, 16GB DDR4">
                </div>

                <div class="form-group">
                    <label for="edit-hdd">HDD</label>
                    <input type="text" id="edit-hdd" name="hdd" placeholder="e.g., 256GB SSD, 1TB HDD">
                </div>

                <div class="form-group">
                    <label for="edit-description">Description</label>
                    <textarea id="edit-description" name="description" rows="4" placeholder="Optional: Add product details, specifications, or notes"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Update Product</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Message container for inventory page -->
    <div id="message" class="message" style="display: none;"></div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Check if company is selected
        window.onload = async function() {
            if (window.initializeRemoteData) {
                await initializeRemoteData();
            }
            const company = getSelectedCompany();
            if (!company) {
                window.location.href = 'index.html';
                return;
            }
            // Set the company switcher to selected company
            const companySwitcher = document.getElementById('company-switcher');
            if (companySwitcher) {
                companySwitcher.value = company;
            }
            // Setup branch switcher visibility and value
            const branchRow = document.getElementById('branch-switcher-row');
            const branchSwitcher = document.getElementById('branch-switcher');
            if (company === 'Transworld Terminals') {
                branchRow.style.display = 'block';
                const savedBranch = getSelectedBranch && getSelectedBranch();
                if (savedBranch) {
                    branchSwitcher.value = savedBranch;
                }
            } else {
                branchRow.style.display = 'none';
                branchSwitcher.value = '';
                setSelectedBranch('');
            }
            
            // Show warranty expiry warning
            showWarrantyWarning();
            
            displayInventory();
        };

        function switchCompany() {
            const companySwitcher = document.getElementById('company-switcher');
            const selectedCompany = companySwitcher.value;
            
            if (selectedCompany) {
                setSelectedCompany(selectedCompany);
                // Manage branch UI and reset branch if needed
                if (selectedCompany !== 'Transworld Terminals') {
                    setSelectedBranch('');
                }
                // Reload the page to show new company's inventory
                window.location.reload();
            } else {
                // If no company selected, go back to home
                window.location.href = 'index.html';
            }
        }

        function switchBranch() {
            const branchSwitcher = document.getElementById('branch-switcher');
            const selectedBranch = branchSwitcher.value;
            setSelectedBranch(selectedBranch || '');
            // Reload to reflect any branch-specific UI in future
            window.location.reload();
        }

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('edit-modal');
            if (event.target === modal) {
                closeEditModal();
            }
        }
    </script>
</body>
</html>
