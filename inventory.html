<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - IT Inventory Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="images/logo.jpg" alt="TRANSWORLD GROUP SINGAPORE" class="logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <h1 class="logo-fallback" style="display: none;">TRANSWORLD GROUP SINGAPORE</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="add-product.html">Add Product</a>
                <a href="inventory.html" class="active">Inventory</a>
            </nav>
        </header>

        <main>
            <div class="page-header">
                <h2>Inventory</h2>
                <div class="page-actions">
                    <button onclick="document.getElementById('import-file').click()" class="btn btn-secondary">📥 Import from Excel</button>
                    <input type="file" id="import-file" accept=".csv,.xls,.xlsx" style="display: none;" onchange="importFromExcel(event)">
                    <button onclick="exportToExcel()" class="btn btn-secondary" id="export-btn" title="Export all products or filtered search results">📊 Export to Excel</button>
                    <a href="add-product.html" class="btn btn-primary">➕ Add Product</a>
                </div>
            </div>

            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 Search by product name, category, user, or description..." onkeyup="handleSearch()">
                <button onclick="clearSearch()" class="btn-clear-search" id="clear-search-btn" style="display: none;">✕ Clear</button>
            </div>

            <div id="inventory-container">
                <div id="empty-state" class="empty-state" style="display: none;">
                    <p>📦 No products in inventory yet.</p>
                    <a href="add-product.html" class="btn btn-primary">Add Your First Product</a>
                </div>

                <div id="inventory-list" class="inventory-list"></div>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Product</h2>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="edit-form" class="product-form" onsubmit="handleEditSubmit(event); return false;">
                <input type="hidden" id="edit-id" name="id">
                
                <div class="form-group">
                    <label for="edit-name">Product Name *</label>
                    <input type="text" id="edit-name" name="name" required placeholder="e.g., Dell XPS 13 Laptop">
                </div>

                <div class="form-group">
                    <label for="edit-category">Category *</label>
                    <select id="edit-category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Desktop">Desktop</option>
                        <option value="Monitor">Monitor</option>
                        <option value="Keyboard">Keyboard</option>
                        <option value="Mouse">Mouse</option>
                        <option value="Printer">Printer</option>
                        <option value="Network Device">Network Device</option>
                        <option value="Server">Server</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="edit-user">User *</label>
                    <input type="text" id="edit-user" name="user" required placeholder="e.g., John Doe">
                </div>

                <div class="form-group">
                    <label for="edit-description">Description</label>
                    <textarea id="edit-description" name="description" rows="4" placeholder="Optional: Add product details, specifications, or notes"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Update Product</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Message container for inventory page -->
    <div id="message" class="message" style="display: none;"></div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Load and display inventory on page load
        displayInventory();

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('edit-modal');
            if (event.target === modal) {
                closeEditModal();
            }
        }
    </script>
</body>
</html>
