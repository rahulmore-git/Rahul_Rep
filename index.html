<body>
    <div class="container">
        <header>
            <img src="images/logo.jpg" alt="TRANSWORLD GROUP SINGAPORE" class="logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <h1 class="logo-fallback" style="display: none;">TRANSWORLD GROUP SINGAPORE</h1>
            <p class="subtitle">Simple inventory tracking for IT products</p>
        </header>

        <main class="landing">
            <div class="hero">
                <h2>Welcome to IT Inventory Manager</h2>
                <p>Manage your IT product inventory with ease. Track products, quantities, and categories all in one place.</p>
            </div>

            <div id="company-selection" class="company-selection">
                <h3>Select Company</h3>
                <p>Please select a company to access inventory features</p>
                <select id="company-select" class="company-select" onchange="enableProceedButton()">
                    <option value="">-- Select Company --</option>
                    <option value="TGLS">TGLS</option>
                    <option value="Transworld Terminals">Transworld Terminals</option>
                    <option value="SOL">SOL</option>
                    <option value="BLPL">BLPL</option>
                    <option value="TLPL">TLPL</option>
                </select>

                <div id="branch-row" style="display: none; margin-top: 10px;">
                    <h3>Select Branch</h3>
                    <select id="branch-select" class="company-select" onchange="enableProceedButton()">
                        <option value="">-- Select Branch --</option>
                        <option value="Nhavaseva">Nhavaseva</option>
                        <option value="Mundra Unit 1">Mundra Unit 1</option>
                        <option value="Mundra Unit 2">Mundra Unit 2</option>
                        <option value="Kolkata">Kolkata</option>
                        <option value="Dadri">Dadri</option>
                    </select>
                </div>
                <button id="proceed-btn" class="btn btn-primary proceed-btn" onclick="proceedToInventory()" disabled>
                    Proceed to Inventory
                </button>
            </div>
        </main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script>
        function enableProceedButton() {
            const companySelect = document.getElementById('company-select');
            const branchRow = document.getElementById('branch-row');
            const branchSelect = document.getElementById('branch-select');
            const proceedBtn = document.getElementById('proceed-btn');
            const selectedCompany = companySelect.value;
            
            // Show branch selection only for Transworld Terminals
            if (selectedCompany === 'Transworld Terminals') {
                branchRow.style.display = 'block';
                const selectedBranch = branchSelect.value;
                proceedBtn.disabled = !selectedBranch;
            } else {
                branchRow.style.display = 'none';
                branchSelect.value = '';
                proceedBtn.disabled = !selectedCompany;
            }
        }

        function proceedToInventory() {
            const companySelect = document.getElementById('company-select');
            const branchSelect = document.getElementById('branch-select');
            const selectedCompany = companySelect.value;
            
            if (selectedCompany) {
                setSelectedCompany(selectedCompany);
                if (selectedCompany === 'Transworld Terminals') {
                    setSelectedBranch(branchSelect.value || '');
                } else {
                    setSelectedBranch('');
                }
                // Redirect to inventory page
                window.location.href = 'inventory.html';
            }
        }

        // Check if company is already selected on page load
        window.onload = async function() {
            if (window.initializeRemoteData) {
                await initializeRemoteData();
            }
            const selectedCompany = getSelectedCompany();
            const savedBranch = getSelectedBranch && getSelectedBranch();
            const branchSelect = document.getElementById('branch-select');
            if (selectedCompany) {
                document.getElementById('company-select').value = selectedCompany;
                // Ensure branch UI reflects state
                enableProceedButton();
                if (selectedCompany === 'Transworld Terminals' && savedBranch) {
                    branchSelect.value = savedBranch;
                    enableProceedButton();
                }
            }
        };
    </script>
</body>
</html>
